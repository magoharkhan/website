<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Turbo Road Racer</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09131b;color:#fff;font-family:Arial,sans-serif;touch-action:none}
body{display:grid;place-items:center}.game{width:min(100vw,520px);height:min(100dvh,900px);min-height:450px;background:#101c27;border:5px solid #33495b;border-radius:20px;padding:8px;display:flex;flex-direction:column;box-shadow:0 15px 50px #0009}
.header{height:36px;flex:0 0 36px;display:flex;align-items:center;justify-content:space-between;padding:0 6px;font-size:13px;font-weight:900;letter-spacing:1px;color:#b8d1df}
.header span:first-child{color:#ffe36b}.screen{position:relative;flex:1;min-height:0;overflow:hidden;border:3px solid #dce8f1;border-radius:5px;background:#477d40}
canvas{width:100%;height:100%;display:block}
.hud{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:6px;align-items:flex-start;pointer-events:none}
.stat{background:#07121bdc;border:1px solid #91a5ae;border-radius:6px;padding:5px 8px;font-size:11px;font-weight:bold;min-width:64px;text-align:center}.stat b{display:block;color:#ffe36b;font-size:15px;margin-top:2px}
.sound{pointer-events:auto;margin-left:auto;border:1px solid #d9e2e8;border-radius:7px;background:#122b3b;color:#fff;font-weight:bold;padding:7px 9px;font-size:12px}
.overlay{position:absolute;inset:0;background:#06121bdc;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px}
.panel{width:min(100%,350px);background:#132b38;border:2px solid #7796a3;border-radius:16px;padding:22px;box-shadow:0 12px 30px #0008}
h1{font-size:clamp(26px,7vw,40px);margin:0 0 8px;color:#ffe36b;text-shadow:2px 3px #9d4b24}
p{font-size:14px;line-height:1.5;color:#e3edf1;margin:8px 0 16px}
button{border:0;border-radius:9px;background:#ffdc50;color:#1c2630;font-size:16px;font-weight:900;padding:12px 20px}
.controls{height:82px;flex:0 0 82px;display:flex;align-items:center;justify-content:space-around;gap:10px;padding-top:7px}
.controls button{height:62px;width:30%;border-radius:13px;background:#263d50;color:#fff;border:1px solid #6e8b9d;font-size:25px;touch-action:none}
.controls button:active{background:#41647a;transform:translateY(2px)}
.note{height:15px;flex:0 0 15px;text-align:center;font-size:10px;color:#91a5b4}
@media(max-height:550px){.game{height:98dvh;min-height:0}.header{height:24px;flex-basis:24px}.controls{height:58px;flex-basis:58px}.controls button{height:45px}.note{display:none}}
</style>
</head>
<body>
<div class="game">
 <div class="header"><span>🏁 TURBO ROAD RACER</span><span>ARCADE EDITION</span></div>
 <div class="screen">
  <canvas id="c"></canvas>
  <div class="hud">
   <div class="stat">SCORE<b id="score">0</b></div>
   <div class="stat">LEVEL<b id="level">1</b></div>
   <div class="stat">LIVES<b id="lives">♥ ♥ ♥</b></div>
   <button class="sound" id="sound">🔊 SOUND ON</button>
  </div>
  <div class="overlay" id="start"><div class="panel"><h1>TURBO RACER</h1><p>Race through traffic, dodge other cars and beat your high score!<br><br><b>Move:</b> ◀ ▶ or A / D<br><b>Mobile:</b> use the buttons below</p><button id="play">START RACE</button></div></div>
  <div class="overlay" id="over" style="display:none"><div class="panel"><h1>RACE OVER!</h1><p>Your score: <b id="final">0</b></p><button id="again">RACE AGAIN</button></div></div>
 </div>
 <div class="controls">
  <button id="left" aria-label="Left">◀</button>
  <button id="pause" aria-label="Pause">Ⅱ</button>
  <button id="right" aria-label="Right">▶</button>
 </div>
 <div class="note">KEYBOARD: ← → / A D &nbsp; • &nbsp; SPACE: PAUSE</div>
</div>
<script>
(()=>{
const c=document.getElementById('c'),ctx=c.getContext('2d'),$=id=>document.getElementById(id);
let W=0,H=0,dpr=1,active=false,paused=false,last=0,score=0,lives=3,level=1,playerLane=1,traffic=[],roadScroll=0,spawn=0,soundOn=true,audio=null;
const lanes=4,carColors=['#ed5142','#f0b82f','#36a7e5','#a66add','#eeeeee','#36bd78'];
let player={x:0,y:0,w:0,h:0};
function resize(){let r=c.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);c.width=Math.round(r.width*dpr);c.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);W=r.width;H=r.height;player.w=Math.min(W*.105,39);player.h=player.w*1.62;player.y=H-player.h-17;player.x=laneX(playerLane)-player.w/2;}
function road(){return{x:W*.09,w:W*.82}}function laneX(n){let r=road();return r.x+r.w*(n+.5)/lanes}
function audioReady(){if(!soundOn)return null;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}catch(e){return null}}
function beep(freq=440,dur=.08,type='square',vol=.035){let a=audioReady();if(!a)return;let o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(freq,a.currentTime);g.gain.setValueAtTime(vol,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+dur)}
function crashSound(){beep(115,.22,'sawtooth',.08);setTimeout(()=>beep(70,.18,'triangle',.05),70)}
function drawCar(x,y,w,h,color,isPlayer=false){
 ctx.fillStyle='#101820';ctx.beginPath();ctx.roundRect(x-w*.48,y+h*.12,w*.96,h*.8,5);ctx.fill();
 ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x-w*.45,y+h*.12,w*.9,h*.78,5);ctx.fill();
 ctx.fillStyle=isPlayer?'#a6f0ff':'#b8d0dc';ctx.beginPath();ctx.roundRect(x-w*.32,y+h*.17,w*.64,h*.22,4);ctx.fill();
 ctx.fillStyle='#263f52';ctx.fillRect(x-w*.34,y+h*.5,w*.68,h*.17);
 ctx.fillStyle='#ffeaa0';ctx.fillRect(x-w*.4,y+h*.79,w*.22,h*.07);ctx.fillRect(x+w*.18,y+h*.79,w*.22,h*.07);
 ctx.fillStyle='#101820';ctx.fillRect(x-w*.52,y+h*.27,w*.12,h*.2);ctx.fillRect(x+w*.4,y+h*.27,w*.12,h*.2);
 if(isPlayer){ctx.fillStyle='#fff16a';ctx.fillRect(x-w*.1,y+h*.43,w*.2,h*.08)}
}
function drawRoad(){let r=road();ctx.fillStyle='#39bf4c';ctx.fillRect(0,0,W,H);ctx.fillStyle='#536987';ctx.fillRect(r.x,0,r.w,H);
 ctx.fillStyle='#617b9f';ctx.fillRect(r.x+3,0,r.w-6,H);ctx.fillStyle='#e8edf1';ctx.fillRect(r.x+2,0,4,H);ctx.fillRect(r.x+r.w-6,0,4,H);
 ctx.strokeStyle='#e6ebef';ctx.lineWidth=Math.max(3,W*.012);ctx.setLineDash([H*.04,H*.035]);ctx.lineDashOffset=-roadScroll;
 for(let i=1;i<lanes;i++){let x=r.x+r.w*i/lanes;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}ctx.setLineDash([]);
}
function update(dt){let speed=(210+level*27)*dt;roadScroll=(roadScroll+speed)%(H*.075);spawn-=dt;if(spawn<=0){let lane=Math.floor(Math.random()*lanes),w=player.w*.92,h=player.h*.95;traffic.push({lane,x:laneX(lane)-w/2,y:-h-8,w,h,color:carColors[Math.floor(Math.random()*carColors.length)],speed:1});spawn=Math.max(.42,1.05-level*.07)*(0.75+Math.random()*.5)}
 let target=laneX(playerLane)-player.w/2;player.x+=(target-player.x)*Math.min(1,dt*22);
 traffic.forEach(e=>e.y+=(175+level*24)*dt);traffic=traffic.filter(e=>e.y<H+e.h);
 for(let i=traffic.length-1;i>=0;i--){let e=traffic[i];if(e.y+e.h>player.y+8&&e.y<player.y+player.h-5&&Math.abs((e.x+e.w/2)-(player.x+player.w/2))<player.w*.72){traffic.splice(i,1);lives--;crashSound();$('lives').textContent='♥ '.repeat(lives).trim()||'0';if(lives<=0){end();return}}}
 score+=dt*14;level=1+Math.floor(score/180);$('score').textContent=Math.floor(score);$('level').textContent=level;
}
function draw(){ctx.clearRect(0,0,W,H);drawRoad();traffic.forEach(e=>drawCar(e.x+e.w/2,e.y,e.w,e.h,e.color));drawCar(player.x+player.w/2,player.y,player.w,player.h,'#17b978',true)}
function loop(t){if(!active)return;let dt=Math.min((t-last)/1000||0,.04);last=t;if(!paused)update(dt);draw();if(active)requestAnimationFrame(loop)}
function start(){audioReady();score=0;lives=3;level=1;playerLane=1;traffic=[];spawn=.4;roadScroll=0;paused=false;active=true;$('lives').textContent='♥ ♥ ♥';$('score').textContent='0';$('level').textContent='1';$('start').style.display='none';$('over').style.display='none';$('pause').textContent='Ⅱ';last=performance.now();beep(660,.12,'square',.04);requestAnimationFrame(loop)}
function end(){active=false;$('final').textContent=Math.floor(score);$('over').style.display='flex';beep(180,.3,'sawtooth',.06)}
function move(d){if(active&&!paused){playerLane=Math.max(0,Math.min(lanes-1,playerLane+d));beep(300,.035,'square',.015)}}
function togglePause(){if(!active)return;paused=!paused;$('pause').textContent=paused?'▶':'Ⅱ';if(!paused){last=performance.now();requestAnimationFrame(loop)}else{draw();ctx.fillStyle='#06111b99';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='bold 28px Arial';ctx.textAlign='center';ctx.fillText('PAUSED',W/2,H/2)}}
$('play').onclick=start;$('again').onclick=start;$('left').onpointerdown=e=>{e.preventDefault();move(-1)};$('right').onpointerdown=e=>{e.preventDefault();move(1)};$('pause').onclick=togglePause;
$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 SOUND ON':'🔇 SOUND OFF';if(soundOn){audioReady();beep(520,.08)}};
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','a','d','A','D'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')move(-1);if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')move(1);if(e.key===' ')togglePause()});
window.addEventListener('resize',resize);resize();draw();
})();
</script>
</body></html>
